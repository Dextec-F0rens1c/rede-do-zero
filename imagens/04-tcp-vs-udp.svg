<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="Comparativo entre TCP e UDP">
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .h1{font-size:24px;font-weight:700;fill:#0f172a}
    .sub{font-size:14px;fill:#64748b}
    .hd{font-size:18px;font-weight:700}
    .lb{font-size:13px;font-weight:700;fill:#334155}
    .ce{font-size:13px;fill:#0f172a}
    .mo{font-size:12px;fill:#475569}
    .foot{font-size:13px;fill:#3730a3}
  </style>
  <rect width="900" height="570" fill="#f8fafc"/>

  <text x="450" y="42" class="h1" text-anchor="middle">TCP ou UDP</text>
  <text x="450" y="68" class="sub" text-anchor="middle">A escolha entre eles e escolher entre confiabilidade e velocidade</text>

  <rect x="250" y="96" width="310" height="46" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="405" y="126" class="hd" fill="#1e3a8a" text-anchor="middle">TCP</text>

  <rect x="580" y="96" width="280" height="46" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="720" y="126" class="hd" fill="#7c2d12" text-anchor="middle">UDP</text>

  <line x1="40" y1="158" x2="860" y2="158" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="188" class="lb">Conexao</text>
  <text x="262" y="188" class="ce">Handshake de 3 vias</text>
  <text x="592" y="188" class="ce">Nenhuma</text>
  <line x1="40" y1="204" x2="860" y2="204" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="234" class="lb">Confiabilidade</text>
  <text x="262" y="234" class="ce">Garante a entrega</text>
  <text x="592" y="234" class="ce">Pode perder dados</text>
  <line x1="40" y1="250" x2="860" y2="250" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="280" class="lb">Ordem</text>
  <text x="262" y="280" class="ce">Garante a ordem</text>
  <text x="592" y="280" class="ce">Pode chegar embaralhado</text>
  <line x1="40" y1="296" x2="860" y2="296" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="326" class="lb">Velocidade</text>
  <text x="262" y="326" class="ce">Mais lento, mais seguro</text>
  <text x="592" y="326" class="ce">Mais rapido, mais simples</text>
  <line x1="40" y1="342" x2="860" y2="342" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="372" class="lb">Tipo de socket</text>
  <text x="262" y="372" class="mo">SOCK_STREAM</text>
  <text x="592" y="372" class="mo">SOCK_DGRAM</text>
  <line x1="40" y1="388" x2="860" y2="388" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="418" class="lb">Chamadas</text>
  <text x="262" y="418" class="mo">send() / recv()</text>
  <text x="592" y="418" class="mo">sendto() / recvfrom()</text>
  <line x1="40" y1="434" x2="860" y2="434" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="464" class="lb">Uso tipico</text>
  <text x="262" y="464" class="ce">Web, e-mail, FTP</text>
  <text x="592" y="464" class="ce">Streaming, DNS, jogos</text>
  <line x1="40" y1="480" x2="860" y2="480" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="52" y="512" class="lb">Conexoes</text>
  <text x="262" y="512" class="ce">Uma para uma</text>
  <text x="592" y="512" class="ce">Uma para muitos</text>

  <text x="450" y="552" class="foot" text-anchor="middle">HTTP usa TCP. DNS e video ao vivo usam UDP. No seu projeto, os dois lado a lado.</text>
</svg>
