<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Anatomia de um pacote IP com header TCP">
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .h1{font-size:24px;font-weight:700;fill:#0f172a}
    .sub{font-size:14px;fill:#64748b}
    .sec{font-size:13px;font-weight:700;letter-spacing:1px}
    .fn{font-size:12px;font-weight:700;fill:#0f172a}
    .fm{font-family:Consolas,monospace;font-size:11px;fill:#1d4ed8}
    .fv{font-family:Consolas,monospace;font-size:10px;fill:#64748b}
    .bd{font-family:Consolas,monospace;font-size:12px;fill:#166534}
    .pa{font-size:15px;font-weight:700;fill:#7c2d12}
    .foot{font-size:12px;fill:#475569}
  </style>
  <rect width="1200" height="560" fill="#f8fafc"/>

  <text x="600" y="40" class="h1" text-anchor="middle">Anatomia de um pacote</text>
  <text x="600" y="66" class="sub" text-anchor="middle">E exatamente isto que o inspetor.py le byte a byte</text>

  <text x="40" y="108" class="sec" fill="#0369a1">HEADER IP  (bytes 0 a 19, 20 bytes)</text>

  <rect x="40" y="122" width="90" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="152" class="fn" text-anchor="middle">Ver / IHL</text>
  <text x="85" y="172" class="fm" text-anchor="middle">4 / 5</text>

  <rect x="130" y="122" width="90" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="175" y="152" class="fn" text-anchor="middle">Tamanho</text>
  <text x="175" y="172" class="fm" text-anchor="middle">40 bytes</text>

  <rect x="220" y="122" width="70" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="255" y="152" class="fn" text-anchor="middle">TTL</text>
  <text x="255" y="172" class="fm" text-anchor="middle">64</text>

  <rect x="290" y="122" width="110" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="345" y="146" class="fn" text-anchor="middle">Protocolo</text>
  <text x="345" y="164" class="fm" text-anchor="middle">6 = TCP</text>
  <text x="345" y="182" class="fv" text-anchor="middle">17 = UDP</text>

  <rect x="400" y="122" width="380" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="590" y="146" class="fn" text-anchor="middle">IP Origem  (posicao 12 a 15)</text>
  <text x="590" y="170" class="fm" text-anchor="middle">127.0.0.1</text>
  <text x="590" y="186" class="fv" text-anchor="middle">socket.inet_ntoa(raw[12:16])</text>

  <rect x="780" y="122" width="380" height="72" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="970" y="146" class="fn" text-anchor="middle">IP Destino  (posicao 16 a 19)</text>
  <text x="970" y="170" class="fm" text-anchor="middle">127.0.0.1</text>
  <text x="970" y="186" class="fv" text-anchor="middle">socket.inet_ntoa(raw[16:20])</text>

  <text x="40" y="248" class="sec" fill="#15803d">HEADER TCP  (bytes 20 a 39, comeca em raw[ihl])</text>

  <rect x="40" y="262" width="140" height="72" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="110" y="288" class="fn" text-anchor="middle">Porta Origem</text>
  <text x="110" y="310" class="fm" text-anchor="middle">54321</text>
  <text x="110" y="326" class="fv" text-anchor="middle">aleatoria</text>

  <rect x="180" y="262" width="140" height="72" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="250" y="288" class="fn" text-anchor="middle">Porta Destino</text>
  <text x="250" y="310" class="fm" text-anchor="middle">5000</text>
  <text x="250" y="326" class="fv" text-anchor="middle">o seu servidor</text>

  <rect x="320" y="262" width="210" height="72" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="425" y="288" class="fn" text-anchor="middle">Seq</text>
  <text x="425" y="310" class="fm" text-anchor="middle">0</text>
  <text x="425" y="326" class="fv" text-anchor="middle">struct.unpack(!I, [4:8])</text>

  <rect x="530" y="262" width="210" height="72" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="635" y="288" class="fn" text-anchor="middle">Ack</text>
  <text x="635" y="310" class="fm" text-anchor="middle">0</text>
  <text x="635" y="326" class="fv" text-anchor="middle">struct.unpack(!I, [8:12])</text>

  <rect x="740" y="262" width="140" height="72" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
  <text x="810" y="288" class="fn" text-anchor="middle">Flags</text>
  <text x="810" y="310" class="fm" text-anchor="middle">0x02</text>
  <text x="810" y="326" class="fv" text-anchor="middle">SYN</text>

  <rect x="880" y="262" width="280" height="72" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1020" y="288" class="fn" text-anchor="middle">Janela / Checksum / Urgent</text>
  <text x="1020" y="312" class="fm" text-anchor="middle">resto do header TCP</text>

  <text x="40" y="388" class="sec" fill="#b45309">PAYLOAD  (os dados que voce escreveu)</text>

  <rect x="40" y="402" width="1120" height="56" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="600" y="428" class="bd" text-anchor="middle">GET / HTTP/1.1 \r\n Host: x \r\n\r\n</text>
  <text x="600" y="448" class="fv" text-anchor="middle">e o mesmo que o Wireshark mostra na aba Payload</text>

  <rect x="40" y="482" width="1120" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="600" y="510" class="foot" text-anchor="middle">raw[ihl] e o truque: o header TCP nao comeca no byte 20 fixo, comeca onde o header IP acabar.</text>
</svg>
